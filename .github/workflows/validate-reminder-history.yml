name: Validate reminder history
on:
  push:
    branches: [codex/payment-reminder-history-20261005]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --check js/adminPayments.js
      - run: node --check backend/helloasso-worker/src/worker.js
      - working-directory: backend/helloasso-worker
        run: npm install --no-audit --no-fund
      - working-directory: backend/helloasso-worker
        run: npx wrangler deploy --dry-run --outdir /tmp/mma-worker-build
